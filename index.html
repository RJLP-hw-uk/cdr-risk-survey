.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{font-size:.74rem;color:var(--ink-2)}
td.num{text-align:center}

                      : '<p class="small">Copy the code below and email it to <span class="contact">' + esc(CONTACT) + '</span>. It contains only your answers.</p>') +
        '<textarea class="code-box" id="code" readonly></textarea>' +
        '<div class="row"><span class="status" id="cs"></span><span style="display:flex;gap:8px">' + (downloads ? '<button class="btn ghost sm" id="sf" type="button">Save file</button>' : '') + '<button class="btn sm" id="copy" type="button">Copy</button></span></div>' +
        partList() + tail + '</div>';
      var box = document.getElementById("code"); box.value = d.code;
      document.getElementById("copy").addEventListener("click", function(){
        var s = document.getElementById("cs");
        navigator.clipboard.writeText(d.code).then(function(){ s.textContent = "Copied"; }, function(){ box.focus(); box.select(); s.textContent = "Selected; press Ctrl+C or ⌘C."; });
      });
      var sf = document.getElementById("sf");
      if (sf) sf.addEventListener("click", function(){ var s = document.getElementById("cs"); downloads.save({filename:"cdr-risk-answers.txt", data:d.code}).then(function(){ s.textContent = "Saved"; }, function(e){ s.textContent = e && e.code === "declined" ? "" : "Not available here; use Copy."; }); });
    }
    bindParts();
  }

  function go(dir){
    var st = steps(), i = st.indexOf(S.step), j = Math.max(0, Math.min(st.length - 1, i + dir));
    if (dir > 0) {
      if (S.step === "q1" && S.exp == null) return;
      if (S.step === "q2" && S.sector == null) return;
      if (S.step === "q3" && !canLeaveCat()) return;
      if (S.step === "int" && S.cat === "other" && !S.otherInt.trim()) return;
      if (S.step === "review") return;
    }
    S.step = st[j]; persist(); render();
  }

  // swipe and arrow keys
  var sx = null, sy = null;
  app.addEventListener("touchstart", function(e){ var p = e.changedTouches[0]; sx = p.clientX; sy = p.clientY; }, {passive:true});
  app.addEventListener("touchend", function(e){
    if (sx == null || S.done) return; var p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
  }, {passive:true});
  document.addEventListener("keydown", function(e){
    if (S.done || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });

  // ---------------- owner results
  var resEl = document.getElementById("results"), RESP = [], OLD = 0, unsub = null;
  function median(a){ if (!a.length) return null; var s = a.slice().sort(function(x, y){ return x - y; }), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
  function f1(x){ return x == null ? "–" : String(Math.round(x * 10) / 10); }
  function cellFor(list, scn, rid){
    var Ls = [], Is = [], ns = 0;
    list.forEach(function(x){ var v = x.ratings[scn] && x.ratings[scn][rid]; if (Array.isArray(v)) { Ls.push(v[0]); Is.push(v[1]); } else if (v === "ns") ns++; });
    return Ls.length ? f1(median(Ls)) + '/' + f1(median(Is)) + ' <span class="muted">(' + Ls.length + (ns ? '+' + ns + '?' : '') + ')</span>' : (ns ? '<span class="muted">' + ns + '?</span>' : '–');
  }
  function renderResults(){
    var head = '<tr><th>Technology</th><th>Part</th><th>n</th>' + RISKS.map(function(k){ return '<th title="' + esc(k.name) + '">' + k.id + '</th>'; }).join("") + '</tr>';
    var body = "";
    CATS.forEach(function(c){
      var list = RESP.filter(function(x){ return x.cat === c.id; }); if (!list.length) return;
      var label = c.id === "other" ? "Other: " + list.map(function(x){ return x.catName; }).join(", ") : c.name;
      body += '<tr><td>' + esc(label) + '</td><td>Standalone</td><td class="num">' + list.length + '</td>' + RISKS.map(function(k){ return '<td class="num">' + cellFor(list, "sa", k.id) + '</td>'; }).join("") + '</tr>';
      var li = list.filter(function(x){ return x.integration; });
      var lw = list.filter(function(x){ return x.weights; });
      if (lw.length) body += '<tr><td class="muted">Importance (median, 1–10)</td><td>Importance</td><td class="num">' + lw.length + '</td>' + RISKS.map(function(k){ return '<td class="num">' + f1(median(lw.map(function(x){ return +x.weights[k.id]; }).filter(function(v){ return v > 0; }))) + '</td>'; }).join("") + '</tr>';
      if (li.length) body += '<tr><td class="muted">' + esc(c.int ? c.int.name : "Own integrations") + '</td><td>Integrated</td><td class="num">' + li.length + '</td>' + RISKS.map(function(k){ return '<td class="num">' + cellFor(li, "int", k.id) + '</td>'; }).join("") + '</tr>';
    });
    if (!body) body = '<tr><td colspan="' + (RISKS.length + 3) + '" class="muted">No responses yet.</td></tr>';
    resEl.innerHTML = '<div class="card"><div class="row"><h2>' + RESP.length + ' responses</h2>' + (downloads ? '<button class="btn ghost sm" id="csv" type="button">CSV</button>' : '') + '</div>' +
      '<p class="small muted">Median likelihood/impact; (n ratings + not sure). Only editors of this page can see this.' + (OLD ? ' ' + OLD + ' response(s) from an earlier survey version are not shown.' : '') + '</p>' +
      '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<textarea id="imp" class="code-box" placeholder="Paste one or more answer codes (CDRRISK2…), one per line" aria-label="Answer codes received by email or form"></textarea>' +
      '<div class="row"><span class="status" id="rs"></span><button class="btn sm" id="imp-btn" type="button">Add responses</button></div></div>';
    var c = document.getElementById("csv");
    if (c) c.addEventListener("click", function(){
      var q = function(s){ s = s == null ? "" : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      var lines = ["response_id,source,submitted_at,experience,sector,category,technology_name,part,integration,model_case,risk,likelihood,impact,not_sure,importance_1_10,comment"];
      RESP.forEach(function(x){ ["sa","int"].forEach(function(scn){
        var rr = x.ratings[scn] || {}; RISKS.forEach(function(k){ var v = rr[k.id]; if (!v) return;
          lines.push([x._id, x.source, x.submittedAt, x.exp, x.sector, x.cat, x.catName, scn === "sa" ? "standalone" : "integrated",
            scn === "int" && x.integration ? x.integration.name : "", scn === "sa" ? x.modelStandalone : (x.integration && x.integration.model),
            k.id, Array.isArray(v) ? v[0] : "", Array.isArray(v) ? v[1] : "", v === "ns" ? 1 : 0, "", x.comment].map(q).join(","));
        });
      });
      if (x.weights) RISKS.forEach(function(k){
        lines.push([x._id, x.source, x.submittedAt, x.exp, x.sector, x.cat, x.catName, "importance", "", "", k.id, "", "", "", +x.weights[k.id] || "", x.comment].map(q).join(","));
      });
      });
      var s = document.getElementById("rs");
      downloads.save({filename:"cdr-risk-survey-responses.csv", data:lines.join("\n")}).then(function(){ s.textContent = "Saved"; }, function(e){ s.textContent = e && e.code === "declined" ? "" : "Download not available here."; });
    });
    document.getElementById("imp-btn").addEventListener("click", async function(){
      var s = document.getElementById("rs"), ta = document.getElementById("imp");
      var codes = (ta.value.match(/CDRRISK2\.[A-Za-z0-9+\/=]+/g) || []);
      if (!codes.length) { s.textContent = "No answer codes found."; return; }
      var added = 0, bad = 0, failed = 0, b = this; b.disabled = true;
      for (var i = 0; i < codes.length; i++) {
        var o; try { o = decode(codes[i]); } catch (e) { bad++; continue; }
        var h = 2166136261; for (var j = 0; j < codes[i].length; j++) { h ^= codes[i].charCodeAt(j); h = Math.imul(h, 16777619) >>> 0; }
        try { await db.collection("responses").doc("code-" + h.toString(36)).set(Object.assign({}, o, {source:"code"})); added++; s.textContent = "Adding\u2026 " + added + " of " + codes.length; }
        catch (e) { failed++; if (e && e.code === "quota_exceeded") break; }
      }
      b.disabled = false; ta.value = failed ? ta.value : "";
      s.textContent = added + " added" + (bad ? ", " + bad + " unreadable" : "") + (failed ? ", " + failed + " not saved" : "") + ". Pasting the same code twice does not create a duplicate.";
    });
  }
  document.getElementById("toggle-results").addEventListener("click", function(){
    resEl.hidden = !resEl.hidden;
    if (!resEl.hidden && !unsub && db) {
      resEl.innerHTML = '<p class="muted">Loading…</p>';
      unsub = db.collection("responses").onSnapshot(function(snap){
        var all = snap.docs.filter(function(d){ return d.exists; }).map(function(d){ return Object.assign({_id:d.id}, d.data()); });
        RESP = all.filter(function(x){ return x.v === 2 && x.ratings && x.ratings.sa; }); OLD = all.length - RESP.length; renderResults();
      }, function(){ resEl.innerHTML = '<p class="err">Could not load responses. Reload to try again.</p>'; unsub = null; });
    }
  });

  // ---------------- boot
  render();
  (async function(){
    try {
      if (!window.claude || !window.claude.use) return;
      var res = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
      db = res[0]; var user = res[1]; downloads = res[2];
      if (user) { uid = await user.id(); if (db && await user.canEdit()) document.getElementById("toggle-results").hidden = false; }
      if (db && uid) {
        var had = false; try { had = !!localStorage.getItem(KEY); } catch(e) {}
        var snap = await db.doc("responses/" + uid).get();
        if (snap.exists && !had) {
          var o = snap.data();
          if (o.v === 2 && o.ratings && o.ratings.sa && CB[o.cat]) {
            S.exp = EXP.indexOf(o.exp); if (S.exp < 0) S.exp = null;
            S.sector = SECTOR.indexOf(o.sector); if (S.sector < 0) S.sector = null;
            S.cat = o.cat; if (o.cat === "other") { S.otherName = o.catName || ""; S.otherInt = o.integration ? o.integration.name : ""; S.intSkip = !o.integration; }
            S.ratings = JSON.parse(JSON.stringify({sa:o.ratings.sa || {}, int:o.ratings.int || {}})); S.weights = o.weights ? Object.assign({}, o.weights) : {}; S.rankDone = !!o.weights; S.comment = o.comment || "";
            S.done = {saved:true, code:encode(o)}; S.step = "review"; persist();
          }
        }
      }
      render();
    } catch (e) {}
  })();
})();
</script>

</body></html>
