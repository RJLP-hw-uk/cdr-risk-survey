  function payload(){
    var c = cat(), ii = intInfo();
    var o = {v:3, submittedAt:new Date().toISOString(), consent:{given:!!S.consent, at:S.consentAt, notice:NOTICE_VERSION}, exp:EXP[S.exp], sector:SECTOR[S.sector],
      cat:S.cat, catName:catName(), modelStandalone:c.sa || null,

      comment:(S.comment || "").slice(0, 2000)};

  function encode(o){ var b = new TextEncoder().encode(JSON.stringify(o)), s = ""; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return "CDRRISK2." + btoa(s); }
  function decode(code){
    var s = String(code).replace(/\s+/g, ""); if (s.indexOf("CDRRISK2.") !== 0) throw new Error("Not an answer code for this survey version.");
    var bin = atob(s.slice(9)), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);

  // Google Forms refuses background (fetch) posts from other sites, so answers are sent as an ordinary form
  // submission into a hidden frame. The reply cannot be read across sites; "saved" means the submission completed.

      var f = document.createElement("form"); f.method = "POST"; f.action = FORM_ACTION; f.target = name; f.style.display = "none"; f.acceptCharset = "UTF-8";
      fields.forEach(function(kv){ var i = document.createElement("input"); i.type = "hidden"; i.name = kv[0]; i.value = kv[1]; f.appendChild(i); });
      function finish(ok){ if (done) return; done = true; clearTimeout(tm); setTimeout(function(){ try { ifr.remove(); f.remove(); } catch (e) {} }, 1000); resolve(ok); }
      var tm = setTimeout(function(){ finish(false); }, 12000);
      ifr.addEventListener("load", function(){ if (ifr.dataset.armed === "1") finish(true); });

  // One readable record per response, "|"-separated in a fixed column order (see TABLE_HEADER), so the
  // Google Sheet can spread it into columns with one formula: =SPLIT(cell, "|", TRUE, FALSE)
  var TABLE_HEADER = ["format","submitted_at","response_id","reference","mode","experience","sector","technology","integration"]
    .concat(RISKS.reduce(function(a, k){ return a.concat(["P1 " + k.name + " likelihood", "P1 " + k.name + " impact"]); }, []))
    .concat(RISKS.reduce(function(a, k){ return a.concat(["P2 " + k.name + " likelihood", "P2 " + k.name + " impact"]); }, []))
    .concat(RISKS.map(function(k){ return "P1 importance " + k.name; })).concat(RISKS.map(function(k){ return "P2 importance " + k.name; })).concat(["consent_at","comment"]);
  // Importance weights: v3 stores {sa:{...}, int:{...}}; v2 stored one set for the stand-alone part.
  function wOf(o, scn){ var w = o.weights; if (!w) return null; if ("sa" in w || "int" in w) return w[scn] || null; return scn === "sa" ? w : null; }
  function tableRow(o){
    function li(v, j){ return Array.isArray(v) ? v[j] : v === "ns" ? "not sure" : ""; }
    var f = ["R2", o.submittedAt, o.rid, o.ref || "", o.mode || "online", o.exp, o.sector, o.catName, o.integration ? o.integration.name : ""];
    RISKS.forEach(function(k){ var v = o.ratings.sa[k.id]; f.push(li(v, 0), li(v, 1)); });
    RISKS.forEach(function(k){ var v = o.integration ? o.ratings.int[k.id] : null; f.push(li(v, 0), li(v, 1)); });
    ["sa","int"].forEach(function(w){ var W = wOf(o, w); RISKS.forEach(function(k){ f.push(W ? W[k.id] : ""); }); });
    f.push(o.consent ? o.consent.at : ""); f.push(o.comment || "");

  window.__tableHeader = TABLE_HEADER;
  var submitting = false;
  async function submit(){
    if (submitting) return; submitting = true;
    var n = document.getElementById("next"); n.disabled = true; n.textContent = "Saving…";
    var data = payload(), saved = false, id = null;
    if (db && uid) {
      id = isEditor ? (S.docId || ("int-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7))) : uid;
      for (var a = 0; a < 2 && !saved; a++) {
        try { await db.doc("responses/" + id).set(Object.assign({source: isEditor ? "interview" : "page"}, data)); saved = true; }
        catch (e) { if (!e || e.code !== "unavailable") break; await new Promise(function(r){ setTimeout(r, 700 + Math.random() * 600); }); }
      }
    }

    submitting = false; persist(); render(); toTop();
  }

  // ---------------- editor view of responses
  var resEl = document.getElementById("results"), RESP = [], OLD = 0, unsub = null;
  function median(a){ if (!a.length) return null; var s = a.slice().sort(function(x, y){ return x - y; }), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
  function f1(x){ return x == null ? "–" : String(Math.round(x * 10) / 10); }
  function cellFor(list, scn, rid){
    var Ls = [], Is = [], ns = 0;
    list.forEach(function(x){ var v = x.ratings && x.ratings[scn] && x.ratings[scn][rid]; if (Array.isArray(v)) { Ls.push(v[0]); Is.push(v[1]); } else if (v === "ns") ns++; });
    return Ls.length ? f1(median(Ls)) + '/' + f1(median(Is)) + ' <span class="muted">(' + Ls.length + (ns ? '+' + ns + '?' : '') + ')</span>' : (ns ? '<span class="muted">' + ns + '?</span>' : '–');
  }
  function csvText(){
    var q = function(s){ s = s == null ? "" : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    var lines = ["response_id,source,respondent_ref,submitted_at,experience,sector,category,technology_name,part,integration,model_case,risk,likelihood,impact,not_sure,importance_1_10,comment"];
    RESP.forEach(function(x){
      ["sa","int"].forEach(function(scn){
        var rr = (x.ratings && x.ratings[scn]) || {};
        RISKS.forEach(function(k){ var v = rr[k.id]; if (!v) return;
          lines.push([x._id, x.source, x.ref, x.submittedAt, x.exp, x.sector, x.cat, x.catName, scn === "sa" ? "standalone" : "integrated",
            scn === "int" && x.integration ? x.integration.name : "", scn === "sa" ? x.modelStandalone : (x.integration && x.integration.model),
            k.id, Array.isArray(v) ? v[0] : "", Array.isArray(v) ? v[1] : "", v === "ns" ? 1 : 0, "", x.comment].map(q).join(","));
        });
      });
      ["sa","int"].forEach(function(w){ var W = wOf(x, w); if (W) RISKS.forEach(function(k){
        lines.push([x._id, x.source, x.ref, x.submittedAt, x.exp, x.sector, x.cat, x.catName, w === "sa" ? "importance standalone" : "importance integrated", "", "", k.id, "", "", "", +W[k.id] || "", x.comment].map(q).join(","));
      }); });
      if (false) RISKS.forEach(function(k){
      });
    });
    return lines.join("\n");
  }
  function renderResults(){
    var keep = document.getElementById("imp") ? document.getElementById("imp").value : "";
    var keepMsg = document.getElementById("rs") ? document.getElementById("rs").textContent : "";
    var head = '<tr><th>Technology</th><th>Part</th><th>n</th>' + RISKS.map(function(k){ return '<th title="' + esc(k.name) + '">' + k.id + '</th>'; }).join("") + '</tr>';
    var body = "";
    CATS.forEach(function(c){
      var list = RESP.filter(function(x){ return x.cat === c.id; }); if (!list.length) return;
      body += '<tr><td>' + esc(c.name) + '</td><td>Standalone</td><td class="num">' + list.length + '</td>' + RISKS.map(function(k){ return '<td class="num">' + cellFor(list, "sa", k.id) + '</td>'; }).join("") + '</tr>';
      var li = list.filter(function(x){ return x.integration; });
      if (li.length) body += '<tr><td class="muted">' + esc(c.int ? c.int.name : "Integrated") + '</td><td>Integrated</td><td class="num">' + li.length + '</td>' + RISKS.map(function(k){ return '<td class="num">' + cellFor(li, "int", k.id) + '</td>'; }).join("") + '</tr>';
      var lw = list.filter(function(x){ return wOf(x, "sa"); });
      if (lw.length) body += '<tr><td class="muted">Importance (median, 1–10)</td><td>Importance</td><td class="num">' + lw.length + '</td>' + RISKS.map(function(k){ return '<td class="num">' + f1(median(lw.map(function(x){ return +wOf(x, "sa")[k.id]; }).filter(function(v){ return v > 0; }))) + '</td>'; }).join("") + '</tr>';
    });
    var other = RESP.filter(function(x){ return !CB[x.cat]; }).length;
    if (!body) body = '<tr><td colspan="' + (RISKS.length + 3) + '" class="muted">No responses yet.</td></tr>';
    var items = RESP.slice().sort(function(a, b){ return String(b.submittedAt).localeCompare(String(a.submittedAt)); }).map(function(x){
      var when = x.submittedAt ? new Date(x.submittedAt).toLocaleString() : "";
      return '<div class="ritem"><div class="t"><b>' + esc(x.ref || (x.source === "interview" ? "Interview" : x.source === "code" ? "From code" : "Online")) + '</b> · ' + esc(x.catName || x.cat) + ' · <span class="muted">' + esc(when) + '</span></div>' +
        '<button class="btn ghost sm" type="button" data-del="' + esc(x._id) + '">Delete</button></div>';
    }).join("");
    resEl.innerHTML = '<div class="card"><div class="row"><h2>' + RESP.length + ' response' + (RESP.length === 1 ? '' : 's') + '</h2>' + (downloads ? '<button class="btn ghost sm" id="csv" type="button">Download CSV</button>' : '') + '</div>' +
      '<p class="small muted">Median likelihood/impact; (n ratings + not sure). Only editors of this page can see this.' + (OLD ? ' ' + OLD + ' response(s) from an earlier survey version are not shown.' : '') + (other ? ' ' + other + ' response(s) for options no longer offered are listed below but not in the table.' : '') + '</p>' +
      '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      (items ? '<div class="rlist">' + items + '</div>' : '') +
      '<textarea id="imp" class="code-box" placeholder="Paste one or more answer codes (CDRRISK2…), one per line" aria-label="Answer codes received by email or form"></textarea>' +
      '<div class="row"><span class="status" id="rs"></span><button class="btn sm" id="imp-btn" type="button">Add responses</button></div></div>';
    document.getElementById("imp").value = keep;
    document.getElementById("rs").textContent = keepMsg;
    var c = document.getElementById("csv");
    if (c) c.addEventListener("click", function(){
      var s = document.getElementById("rs");
      downloads.save({filename:"cdr-risk-survey-responses.csv", data:csvText()}).then(function(){ s.textContent = "Saved"; }, function(e){ s.textContent = e && e.code === "declined" ? "" : "Download not available here."; });
    });
    resEl.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", async function(){
      if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.textContent = "Tap again to delete"; return; }
      b.disabled = true;
      try { await db.doc("responses/" + b.dataset.del).delete(); }
      catch (e) { b.disabled = false; b.textContent = "Delete failed"; }
    }); });
    document.getElementById("imp-btn").addEventListener("click", async function(){
      var s = document.getElementById("rs"), ta = document.getElementById("imp"), b = document.getElementById("imp-btn");
      var codes = (ta.value.match(/CDRRISK2\.[A-Za-z0-9+\/=]+/g) || []);
      if (!codes.length) { s.textContent = "No answer codes found."; return; }
      var added = 0, bad = 0, failed = 0; b.disabled = true;
      for (var i = 0; i < codes.length; i++) {
        var o; try { o = decode(codes[i]); } catch (e) { bad++; continue; }
        var h = 2166136261; for (var j = 0; j < codes[i].length; j++) { h ^= codes[i].charCodeAt(j); h = Math.imul(h, 16777619) >>> 0; }
        try { await db.collection("responses").doc("code-" + h.toString(36)).set(Object.assign({}, o, {source:"code"})); added++; s.textContent = "Adding… " + added + " of " + codes.length; }
        catch (e) { failed++; if (e && e.code === "quota_exceeded") break; }
      }
      var ta2 = document.getElementById("imp"), s2 = document.getElementById("rs"), b2 = document.getElementById("imp-btn");
      if (b2) b2.disabled = false; if (ta2 && !failed) ta2.value = "";
      if (s2) s2.textContent = added + " added" + (bad ? ", " + bad + " unreadable" : "") + (failed ? ", " + failed + " not saved" : "") + ". The same code pasted twice is stored once.";
    });
  }
  document.getElementById("toggle-results").addEventListener("click", function(){
    resEl.hidden = !resEl.hidden;
    this.textContent = resEl.hidden ? "Responses" : "Hide responses";
    if (!resEl.hidden && !unsub && db) {
      resEl.innerHTML = '<p class="muted">Loading…</p>';
      unsub = db.collection("responses").onSnapshot(function(snap){
        var all = snap.docs.filter(function(d){ return d.exists; }).map(function(d){ return Object.assign({_id:d.id}, d.data()); });
        RESP = all.filter(function(x){ return (x.v === 2 || x.v === 3) && x.ratings && x.ratings.sa; }); OLD = all.length - RESP.length; renderResults();
      }, function(){ resEl.innerHTML = '<p class="err">Could not load responses. Reload to try again.</p>'; unsub = null; });
    }
  });

  // ---------------- boot
  render();
  (async function(){
    try {
      if (PREVIEW || !window.claude || !window.claude.use) return;
      var res = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
      db = res[0]; var user = res[1]; downloads = res[2];
      if (user) { uid = await user.id(); isEditor = !!(db && await user.canEdit()); }
      if (isEditor) document.getElementById("toggle-results").hidden = false;
      if (db && uid && !isEditor) {
        var had = false; try { had = !!localStorage.getItem(KEY); } catch(e) {}
        var snap = await db.doc("responses/" + uid).get();
        if (snap.exists && !had) {
          var o = snap.data();
          if (o && (o.v === 2 || o.v === 3) && o.ratings && o.ratings.sa && CB[o.cat]) {
            S.exp = EXP.indexOf(o.exp); if (S.exp < 0) S.exp = null;
            S.sector = SECTOR.indexOf(o.sector); if (S.sector < 0) S.sector = null;
            S.cat = o.cat; S.docId = uid;
            S.ratings = JSON.parse(JSON.stringify({sa:o.ratings.sa || {}, int:o.ratings.int || {}})); var w1 = wOf(o, "sa"), w2 = wOf(o, "int"); S.weights = {sa:Object.assign({}, w1 || {}), int:Object.assign({}, w2 || {})}; S.rankDone = {sa:!!w1, int:!!w2}; S.consent = true; S.consentAt = o.consent ? o.consent.at : null; S.comment = o.comment || "";
            S.done = {saved:true, code:encode(o), at:o.submittedAt}; S.step = "review"; persist();
          }
        }
      }
      render();
    } catch (e) {}
  })();
})();
</script>

</body></html>
