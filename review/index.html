<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CDR Risk Survey v11 Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: the live survey's shell (masthead, progress bar, scrolling card, Back / Next footer), trimmed to five screens */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1C2521; --ink-2:#5A665F; --rule:#D3DAD4;
  --accent:#3E6A2C; --accent-ink:#FFFFFF; --accent-soft:#E3EDDC;
  --h-low:#DDEBD6; --h-mid:#F2E3B6; --h-high:#F0C9BD; --chip:#1C2521; --chip-ink:#FFFFFF;
  --warn:#8A3B24; --s-lo:#6FAF5A; --s-mid:#E6B53E; --s-hi:#CF5B43; --scrim:rgba(0,0,0,.45);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131916; --surface:#1B231F; --ink:#E3EAE5; --ink-2:#9EABA4; --rule:#2F3A34;
  --accent:#9CC46E; --accent-ink:#0F160D; --accent-soft:#25331F;
  --h-low:#203528; --h-mid:#463D20; --h-high:#4C2A24; --chip:#E3EAE5; --chip-ink:#131916;
  --warn:#E59A80; --s-lo:#4F8E3F; --s-mid:#B88A26; --s-hi:#B04A37; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131916; --surface:#1B231F; --ink:#E3EAE5; --ink-2:#9EABA4; --rule:#2F3A34;
  --accent:#9CC46E; --accent-ink:#0F160D; --accent-soft:#25331F;
  --h-low:#203528; --h-mid:#463D20; --h-high:#4C2A24; --chip:#E3EAE5; --chip-ink:#131916;
  --warn:#E59A80; --s-lo:#4F8E3F; --s-mid:#B88A26; --s-hi:#B04A37; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);font-variant-numeric:tabular-nums;overflow:hidden}
.shell{max-width:620px;margin:0 auto;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px}
.scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}
#foot{padding-block:10px max(12px,env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.5rem;line-height:1.15} h2{font-size:1.3rem;line-height:1.2} h3{font-size:1rem;line-height:1.25}
p{margin:0} .muted{color:var(--ink-2)} .small{font-size:.86rem}
.tag{font-size:.8rem;color:var(--ink-2);font-weight:700;letter-spacing:.03em}
.tag.part{color:var(--accent)}
header.mast{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.pv{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--h-mid);color:var(--ink);white-space:nowrap}
.new{font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--h-mid);color:var(--ink);white-space:nowrap;vertical-align:2px;margin-left:4px;font-family:var(--f-body)}
.bar{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.intro{border-left:3px solid var(--accent);padding:6px 0 6px 12px;display:grid;gap:4px}
.facts{display:grid;margin:0}
.facts>div{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--rule)}
.facts dt{font-size:.8rem;font-weight:700;color:var(--ink-2);line-height:1.4}
.facts dd{margin:0;font-size:.92rem;line-height:1.4}
@media (max-width:480px){.facts>div{grid-template-columns:1fr;gap:1px}}
/* "Please share" section at the bottom of the front page, with the QR code of this page's address */
.share{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border-top:1px solid var(--rule);padding-top:12px}
.share h3{margin-bottom:2px}
.qr{display:block;width:112px;height:112px;border-radius:4px;overflow:hidden}
.qr svg{display:block;width:100%;height:100%}
.contact{font-weight:700;user-select:all}
.consent{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;font-size:.92rem;line-height:1.4}
.consent input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt label{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:11px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;line-height:1.3}
.opt label small{color:var(--ink-2);font-size:.82rem}
.opt input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:checked + label small{color:var(--accent-ink);opacity:.85}
.opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.opts.cats{grid-template-columns:1fr;gap:5px}
@media (min-width:560px){.opts.cats{grid-template-columns:1fr 1fr}}
.opts.cats .opt label{flex-direction:column;align-items:flex-start;gap:0;padding:5px 12px;line-height:1.2}
.opts.row3{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:6px}
.opts.row3 .opt label{padding:8px 10px;font-size:.9rem}
.def{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;font-size:.92rem}
.scn{background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;display:grid;gap:4px;font-size:.88rem;line-height:1.35}
.cmp{display:grid;gap:6px}
.crow{display:grid;gap:3px;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r)}
.crow .cl{font-size:.76rem;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.crow .was,.crow .now{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:8px;font-size:.9rem;line-height:1.35}
.crow .was{color:var(--ink-2)} .crow .now{font-weight:700}
.crow .was span,.crow .now span{font-size:.72rem;font-weight:700;color:var(--ink-2);padding-top:2px}
.srows{display:grid;gap:6px}
.srow{display:grid;gap:2px;border-top:1px solid var(--rule);padding-top:6px}
.srow.need{border-top-color:var(--warn)}
.chead{display:flex;align-items:center;gap:8px}
.chead .cn{flex:1 1 auto;min-width:0;font-weight:700;font-size:.9rem;line-height:1.2}
.rq{font-size:.82rem;color:var(--ink-2);line-height:1.3}
.info{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink-2);background:transparent;color:var(--ink-2);font:700 .8rem/1 var(--f-body);font-style:italic;cursor:pointer;flex:none}
.info[aria-expanded=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wdef{font-size:.86rem;background:var(--accent-soft);border-radius:var(--r);padding:8px 10px}
.bscale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));font-size:.72rem;font-weight:700;color:var(--ink-2);line-height:1.15}
.bscale span:nth-child(2){text-align:center}.bscale span:last-child{text-align:right}
.cscale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:.72rem;font-weight:700;color:var(--ink-2);line-height:1.15}
.cscale span{text-align:center}.cscale span:first-child{text-align:left}.cscale span:last-child{text-align:right}
.bex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;font-size:.82rem;line-height:1.3;color:var(--ink-2)}
.bv{font-size:.82rem;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;color:var(--ink)}
.bv.lo{background:var(--h-low)}.bv.mid{background:var(--h-mid)}.bv.hi{background:var(--h-high)}
.bv.unset,.cv.unset{background:transparent;color:var(--ink-2);font-weight:400;padding-inline:0}
.srow.need .bv.unset,.srow.need .cv.unset{color:var(--warn);font-weight:700}
.cv{font-size:.82rem;font-weight:700;text-align:right}
.nsb{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.nsb[aria-pressed=true]{background:var(--chip);border-color:var(--chip);color:var(--chip-ink)}
input[type=range]{width:100%;margin:0;min-height:28px;accent-color:var(--accent)}
input[type=range].unset{accent-color:var(--ink-2)}
input[type=range].bsl{-webkit-appearance:none;appearance:none;height:30px;background:transparent;cursor:pointer}
.bsl::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--s-lo),var(--s-mid),var(--s-hi))}
.bsl::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--s-lo),var(--s-mid),var(--s-hi))}
.bsl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-7px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.bsl::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.bsl.unset{filter:grayscale(1);opacity:.45}
.stack{display:grid;gap:14px}
.box{border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.box.ins{background:var(--accent-soft);border:1px solid var(--accent)}
.box.ans{background:var(--surface);border:2px solid var(--ink)}
.bl{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.box.ans .bl{color:var(--ink)}
.box details{background:var(--surface);border-radius:var(--r);padding:6px 10px}
.box details[open] summary{margin-bottom:6px}
.sep{border:0;border-top:1px solid var(--rule);margin:2px 0}
.rate{display:grid;gap:8px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.sb{font:700 .74rem/1.15 var(--f-body);padding:7px 2px;min-height:38px;border:1px solid var(--rule);border-radius:var(--r);background:transparent;color:var(--ink);cursor:pointer}
.sb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bsl.unset::-webkit-slider-thumb{opacity:0}
.opts.methods .opt label{flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px}
.opts.methods .opt label b{font-size:1rem}
.opts.methods .opt label span{font-size:.88rem}
.bsets{display:grid;gap:8px}
.bset{display:grid;gap:4px;border-top:1px solid var(--rule);padding-top:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:.9rem}
.brow .chip{min-width:5.6rem}
.prow{display:grid;gap:4px;border-top:1px solid var(--rule);padding-top:8px}
.pn{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.86rem;line-height:1.2}
.pn span:last-child{text-align:right}
.ahp{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.ahp .sb{font-size:.78rem;min-height:32px;padding:4px 0}
.wts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.88rem}
.wts span:nth-child(even){text-align:right;font-weight:700}
.bsl.unset::-moz-range-thumb{opacity:0}
.rate .in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate input[type=number]{font:700 1.2rem var(--f-body);width:7rem;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 .82rem var(--f-body);padding:5px 10px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
textarea{width:100%;min-height:84px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px;resize:vertical}
.ref{display:grid;gap:4px} .ref label{font-size:.86rem;font-weight:700}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{font:700 1rem var(--f-body);padding:10px 18px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px;min-width:8rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--warn);font-size:.9rem;font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:700 1em var(--f-body)}
details summary{cursor:pointer;color:var(--ink-2);font-size:.86rem}
pre{font:.75rem/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:10px;white-space:pre-wrap;word-break:break-word}
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--surface);color:var(--ink);border-radius:var(--r);max-width:620px;width:100%;max-height:calc(100% - 32px);display:flex;flex-direction:column}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--rule)}
.sheet .body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 18px;display:grid;gap:10px;font-size:.9rem;line-height:1.45}
.sheet .body ul{margin:0;padding-left:1.1rem}
.sheet footer{padding:10px 18px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end}
.btn:focus-visible,.sb:focus-visible,.linkbtn:focus-visible,.info:focus-visible,.nsb:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){h2{font-size:1.12rem}h1{font-size:1.25rem}.btn{min-width:6.5rem}}
</style>
</head>

<div class="shell">
  <header class="mast"><h1 id="ttl"></h1><span class="pv">Preview v11 · nothing is sent</span></header>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div class="scroll" id="scroll"><main id="app"></main></div>

</div>
<div class="overlay" id="notice" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nt"><header><h2 id="nt">Privacy notice (draft for v11)</h2></header>
  <div class="body" id="nbody"></div><footer><button class="btn" id="nclose" type="button">Close</button></footer></div></div>

// AHP: all 21 pairs of the 7 risks, in random order and with random sides; best-worst: 7 sets of 3 (each pair once)
S.pairs = shuffle(S.order.flatMap((a, i) => S.order.slice(i + 1).map(b => Math.random() < 0.5 ? [a, b] : [b, a])));
const FANO = [[0,1,2],[0,3,4],[0,5,6],[1,3,5],[1,4,6],[2,3,6],[2,4,5]];
S.sets = shuffle(FANO).map(t => shuffle(t.map(k => S.order[k])));
const SAATY = [9, 7, 5, 3, 1, 3, 5, 7, 9];
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const variants = t => ['cp','ch'].filter(v => CB[t] && CB[t][v]);
// One question per "About you" page; each part has a reading page (the project), a rating page and a rate page.
const partPages = p => {
  const risk = p === 'sa' ? (S.fmt === 'ahp' ? ['sa_ahp'] : S.fmt === 'bws' ? ['sa_rate', 'sa_bws'] : ['sa_rate'])
                          : (S.fmt === 'ahp' ? ['cmp_ahp'] : ['cmp_rate']);
  return S.numFirst ? [p + '_num'].concat(risk) : risk.concat([p + '_num']);
};
const steps = () => ['intro'].concat(REVIEW ? ['method'] : []).concat(['role','exp','known']).concat(S.known.length > 1 ? ['best'] : [])
  .concat(['sa_card'].concat(partPages('sa')))
  .concat(S.tech && !S.v ? [] : ['cmp_card'].concat(partPages('cmp'))).concat(['review']);
const fmtName = () => (T.review.options.find(o => o.id === S.fmt) || {}).name || '';
// AHP weights (geometric mean of rows) and consistency ratio for answers {'A|B': signed Saaty value, + = A larger}
function ahpWeights(ans){
  const ids = S.order, n = ids.length, A = ids.map(() => ids.map(() => 1));
  let k = 0;
  S.pairs.forEach(([a, b]) => { const v = ans[a + '|' + b]; if (v == null) return; k++;
    const r = v > 0 ? v : 1 / -v, i = ids.indexOf(a), j = ids.indexOf(b); A[i][j] = r; A[j][i] = 1 / r; });
  if (k < S.pairs.length) return null;
  const g = A.map(row => Math.exp(row.reduce((s, x) => s + Math.log(x), 0) / n)), sum = g.reduce((s, x) => s + x, 0), w = g.map(x => x / sum);
  const lmax = A.map((row, i) => row.reduce((s, x, j) => s + x * w[j], 0) / w[i]).reduce((s, x) => s + x, 0) / n;
  return {w:Object.fromEntries(ids.map((id, i) => [id, w[i]])), cr:(lmax - n) / (n - 1) / 1.32};
}
const bwsScores = () => Object.fromEntries(S.order.map(id => [id, S.sets.reduce((s, set, i) => s + (S.bws[i]?.b === id ? 1 : 0) - (S.bws[i]?.w === id ? 1 : 0), 0)]));
// The rate page comes before or after the rating page at random (same order in both parts), and the order is recorded.
// The host-financing row is asked only for co-hosted versions.
const cmpIds = () => S.order.concat(S.v === 'ch' ? ['FIN'] : []);

// Allocation: among the cells of the technologies ticked (variant cells, or the baseline for technologies
// without a variant), the one with the fewest answers, preferring the best-known technology by BEST_BONUS.
function allocate(){
  const best = S.best && S.known.includes(S.best) ? S.best : S.known[0];
  const opts = [];
  S.known.forEach(t => (variants(t).length ? variants(t) : [null]).forEach(v =>
    opts.push({t, v, score:(DEMO_COUNTS[t + ':' + (v || 'sa')] ?? 0) - (t === best ? BEST_BONUS : 0)})));
  if (!opts.length) return null;
  opts.sort((a, b) => a.score - b.score);
  return opts[0];
}

// Two boxes on every answer page: the instructions (tinted) and the answers (outlined).
const insBox = (label, inner, full) => `<section class="box ins" aria-label="${esc(T.ins_label)}"><span class="bl">${esc(full ? label : label + ' · ' + T.ins_label)}</span>${inner}</section>`;

const baseFacts = c => `<dl class="facts"><div><dt>Site and infrastructure</dt><dd>${esc(c.base.where)}</dd></div><div><dt>Revenue</dt><dd>${esc(c.base.earns)}</dd></div><div><dt>Owner and finance</dt><dd>${esc(c.base.owner)}</dd></div><div><dt>Scale ${NEW}</dt><dd>${esc(c.base.scale)}</dd></div><div><dt>Stage ${NEW}</dt><dd>${esc(c.stage || T.stage)}</dd></div><div><dt>Country ${NEW}</dt><dd>${esc(T.country)}</dd></div></dl>`;
const summary = (name, d) => `<p class="small"><b>${esc(name)}.</b> ${esc(d)}</p>`;
function variantFacts(c){
  const b = c.base, v = c[S.v], changed = ROWS.filter(([k]) => v[k] && v[k] !== b[k]);
  return `${changed.length ? `<div class="cmp"><span class="tag">What changes from the baseline</span>${changed.map(([k, l]) => `<div class="crow"><div class="cl">${l}</div><div class="was"><span>Baseline</span><div>${esc(b[k])}</div></div><div class="now"><span>${PLAB[S.v]}</span><div>${esc(v[k])}</div></div></div>`).join('')}</div>` : ''}

    <div class="def"><b>Where the revenue comes from</b><span>${esc(v.earns || b.earns)}</span></div>
    ${v.same ? `<p class="small"><b>Same as the baseline:</b> ${esc(v.same)}</p>` : ''}`;
}
const again = (title, inner) => `<details><summary>${esc(T.project_again)}: ${esc(title)}</summary>${inner}</details>`;

const chips = (q, opts, sel, attr) => `<div class="row" style="justify-content:flex-start"><span class="small muted">${esc(q)} ${NEW}</span><div class="chips" role="group" aria-label="${esc(q)}">${opts.map((b, i) => `<button type="button" class="chip" ${attr} data-i="${i}" aria-pressed="${sel === i}">${esc(b)}</button>`).join('')}</div></div>`;
function rateAnswers(store, variant){
  const o = S[store];
  const input = (st, label) => S[st].ns ? '' : `<input type="number" inputmode="decimal" min="0.5" max="60" step="0.5" id="r-${st}" value="${S[st].best ?? ''}" aria-label="${esc(label)}, % per year"><span class="muted">% per year</span>`;
  return `<div class="rate" id="blk-${store}">
    <h3>${esc(variant ? T.rate_q_variant : T.rate_q)} ${NEW}</h3>
    <div class="in">${input(store, variant ? T.rate_q_variant : T.rate_q)}<button type="button" class="nsb" id="ns-${store}" aria-pressed="${!!o.ns}">${esc(T.rate_ns)}</button></div>
    ${chips(T.finby_q, T.finby, S.finby[store], `data-finby="${store}"`)}
    ${variant ? '' : `${chips(T.basis_q, T.basis, S.basis, 'data-basis="1"')}${chips(T.country_q, T.countries, S.country, 'data-country="1"')}
    <hr class="sep"><h3>${esc(T.wind_q)}</h3>
    <div class="in">${input('wind', T.wind_q)}<button type="button" class="nsb" id="ns-wind" aria-pressed="${!!S.wind.ns}">${esc(T.rate_ns)}</button></div>`}</div>`;
}
function ahpView(part){
  const c = CB[S.tech], v = c[S.v], ans = S.ahp[part], res = ahpWeights(ans);
  const rows = S.pairs.map(([a, b], i) => { const key = a + '|' + b, x = ans[key];
    return `<div class="prow srow ${S.warned && x == null ? 'need' : ''}" data-row="${key}"><div class="pn"><span>${esc(R(a).name)}</span><span>${esc(R(b).name)}</span></div>
      <div class="ahp" role="radiogroup" aria-label="${esc(R(a).name)} or ${esc(R(b).name)}, pair ${i + 1} of 21">${SAATY.map((n, j) => { const val = j < 4 ? n : j > 4 ? -n : 1;
        return `<button type="button" class="sb" role="radio" data-pk="${key}" data-pv="${val}" aria-checked="${x === val}" aria-label="${j === 4 ? 'About the same' : (j < 4 ? R(a).name : R(b).name) + ' ' + n + ' times larger'}">${j === 4 ? '=' : n}</button>`; }).join('')}</div></div>`; }).join('');
  const head = part === 'base'
    ? insBox(part1(), `<h2>${esc(T.review.ahp_q.base)}</h2><p class="small">${esc(T.review.ahp_hint)}</p>${summary(c.name, c.base.d)}${again(c.name, baseFacts(c))}`)
    : insBox(part2(), `<h2>${esc(T.review.ahp_q.var)}</h2><p class="small">${esc(T.review.ahp_hint)}</p>${summary(v.name, v.d)}${again(v.name, variantFacts(c))}`);
  const how = part === 'base' ? `<div class="row" style="justify-content:flex-start"><span class="small"><b>${esc(T.how_q)}</b> ${NEW}</span><div class="chips" role="group" aria-label="${esc(T.how_q)}">${T.how.map((h, i) => `<button type="button" class="chip" data-how="${i}" aria-pressed="${S.how === i}">${esc(h)}</button>`).join('')}</div></div><hr class="sep">` : '';
  return `<div class="stack">${head}${ansBox(`${how}<p class="err" id="werr" hidden></p><div class="srows">${rows}</div>
    ${res ? `<p class="small muted">${esc(T.review.ahp_cr.replace('{x}', res.cr.toFixed(2)))}</p>` : `<p class="small muted">${Object.keys(ans).length} of 21 pairs answered.</p>`}`)}</div>`;
}

    <button type="button" class="info" data-i="${r.id}" aria-expanded="false" aria-controls="d-${r.id}" aria-label="What ${esc(r.name)} means">i</button>${valHtml}</div>
    <div class="wdef" id="d-${r.id}" hidden>${esc(r.def)}</div>`;
}

        <div class="bex"><span>${esc(c.ex[id])}</span><button type="button" class="nsb" data-n="${id}" aria-pressed="${x === 'ns'}" aria-label="Not sure about ${esc(k.name.toLowerCase())}">Not sure</button></div>
        <input type="range" min="0" max="10" step="1" value="${set ? x : 5}" data-b="${id}" class="bsl ${set ? '' : 'unset'}" aria-labelledby="n-${id}" aria-valuetext="${set ? x + ' of 10' : x === 'ns' ? 'Not sure' : 'Not set'}"></div>`; }).join('');
    return `<div class="stack">
    ${insBox(part1(), `<h2>${esc(T.base_q)}</h2><p class="small">${esc(T.base_hint)}</p>
      <p class="small"><b>Scale:</b> 0 negligible · 5 moderate · 10 severe. "Not sure" is a valid answer.</p>
      ${summary(c.name, c.base.d)}
      ${again(c.name, baseFacts(c))}`)}
    ${ansBox(`<div class="row" style="justify-content:flex-start"><span class="small"><b>${esc(T.how_q)}</b> ${NEW}</span><div class="chips" role="group" aria-label="${esc(T.how_q)}">${T.how.map((h, i) => `<button type="button" class="chip" data-how="${i}" aria-pressed="${S.how === i}">${esc(h)}</button>`).join('')}</div></div>
      <hr class="sep">
      <div class="bscale" aria-hidden="true"><span>0 · Negligible</span><span>5 · Moderate</span><span>10 · Severe</span></div>
      <p class="err" id="werr" hidden></p>
      <div class="srows">${rows}</div>`)}</div>`;
  },

  sa_num: () => {
    const c = CB[S.tech];
    return `<div class="stack">
    ${insBox(part1(), `<h2>${esc(T.rate_head)} ${NEW}</h2><p class="small">${esc(T.rate_help)}</p>
      ${summary(c.name, c.base.d)}
      ${again(c.name, baseFacts(c))}`)}
    ${ansBox(rateAnswers('rate', false))}</div>`;
  },

  cmp_card: () => {
    const c = CB[S.tech], v = c[S.v];
    return `<div class="card"><span class="tag part">${part2()} · The version</span>
    <p class="small muted">${esc(T.variant_def[S.v])}</p>
    <div class="intro"><h2>${esc(v.name)}</h2><p>${esc(v.d)}</p></div>
    ${variantFacts(c)}
    ${insBox('What comes next', `<p class="small">${esc(T.cmp_next)}</p>`, true)}</div>`;
  },

  cmp_rate: () => {
    const c = CB[S.tech], v = c[S.v];
    const own = id => typeof S.base[id] === 'number' ? `Your baseline: ${S.base[id]} / 10` : S.base[id] === 'ns' ? 'Your baseline: not sure' : '';
    const rows = cmpIds().map(id => { const k = R(id), x = S.chg[id], set = x !== undefined;
      return `<div class="srow ${S.warned && !set ? 'need' : ''}" data-row="${id}">${riskHead(k, `<button type="button" class="nsb" data-cn="${id}" aria-pressed="${x === 'ns'}">${esc(T.cant_judge)}</button>`)}
        ${id === 'FIN' ? `<p class="rq">${esc(k.q)}</p>` : own(id) ? `<p class="rq">${own(id)}</p>` : ''}
        <div class="seg" role="radiogroup" aria-labelledby="n-${id}">${CHG.map((l, j) => `<button type="button" class="sb" role="radio" data-c="${id}" data-x="${j - 2}" aria-checked="${x === j - 2}">${l}</button>`).join('')}</div></div>`; }).join('');
    return `<div class="stack">
    ${insBox(part2(), `<h2>${esc(T.cmp_q[S.v])}</h2><p class="small">${esc(T.cmp_hint)}</p>
      ${summary(v.name, v.d)}
      ${again(v.name, variantFacts(c))}`)}
    ${ansBox(`<p class="err" id="werr" hidden></p>
      <div class="srows">${rows}</div>`)}</div>`;
  },

  cmp_num: () => {
    const c = CB[S.tech], v = c[S.v];
    const echo = S.rate.best != null ? `<p class="small"><b>${esc(T.rate_echo.replace('{x}', S.rate.best))}</b></p>` : '';
    return `<div class="stack">
    ${insBox(part2(), `<h2>${esc(T.rate_head)} ${NEW}</h2><p class="small">${esc(T.rate_help)}</p>${echo}
      ${summary(v.name, v.d)}
      ${again(v.name, variantFacts(c))}`)}
    ${ansBox(rateAnswers('vrate', true))}</div>`;
  },

  review: () => `<div class="card"><span class="tag part">Last step${REVIEW ? ' · ' + esc(fmtName()) : ''}</span><h2>${esc(T.review_q)}</h2>
    <p class="muted small">${esc(CB[S.tech].name)} · ${S.fmt === 'ahp' ? `${Object.keys(S.ahp.base).length} of 21 baseline pairs${S.v ? ` · ${Object.keys(S.ahp.var).length} of 21 version pairs` : ''}` : `${Object.keys(S.base).length} of 7 risks rated${S.fmt === 'bws' ? ` · ${Object.keys(S.bws).length} of 7 sets` : ''}${S.v ? ` · ${PLAB[S.v].toLowerCase()}: ${Object.keys(S.chg).length} of ${cmpIds().length} rated` : ''}`}. Use Back to change an answer.</p>
    ${REVIEW ? reviewSummary() : ''}
    <div class="ref"><label for="comment">Comment (optional)</label><textarea id="comment" maxlength="2000">${esc(S.comment)}</textarea></div>
    <details><summary>Record this would send (R10)</summary><pre>${esc(JSON.stringify(payload(), null, 1))}</pre></details></div>`,

  done: () => {
    return `<div class="card"><span class="tag part">Finished</span><h2>${esc(T.done_q)}</h2>
    <p>Your response number is <b class="contact">${rid}</b>. Quote it if you want your answers withdrawn. ${NEW}</p>
    <p class="small muted">${esc(T.done_offers)} This preview stored nothing.</p>
    ${REVIEW ? `<button class="btn" id="another" type="button">${esc(T.review.again)}</button>` : ''}
    <button class="btn ghost" id="restart" type="button">Start the preview again</button></div>`;
  }
};

function reviewSummary(){
  const share = (o, ids) => { const tot = ids.reduce((s, id) => s + Math.max(0, o[id] || 0), 0); return id => tot ? Math.max(0, o[id] || 0) / tot : null; };
  let rows = '', note = '';
  if (S.fmt === 'ahp'){
    const b = ahpWeights(S.ahp.base), v = S.v ? ahpWeights(S.ahp.var) : null;
    if (!b) return '';
    rows = S.order.map(id => `<span>${esc(R(id).name)}</span><span>${(100 * b.w[id]).toFixed(0)}%${v ? ' → ' + (100 * v.w[id]).toFixed(0) + '%' : ''}</span>`).join('');
    note = `AHP weights (share of the risk premium)${v ? ', baseline → version' : ''}. Consistency ratio ${b.cr.toFixed(2)}${v ? ' and ' + v.cr.toFixed(2) : ''}.`;
  } else {
    const num = Object.fromEntries(S.order.map(id => [id, typeof S.base[id] === 'number' ? S.base[id] : 0]));
    const sh = share(num, S.order);
    let bw = null;
    if (S.fmt === 'bws'){ const sc = bwsScores(); const r = Object.fromEntries(S.order.map(id => { const B = S.sets.filter((_, i) => S.bws[i]?.b === id).length, W = S.sets.filter((_, i) => S.bws[i]?.w === id).length; return [id, Math.sqrt((B + .5) / (W + .5))]; })); bw = share(r, S.order); }
    rows = S.order.map(id => `<span>${esc(R(id).name)}</span><span>${sh(id) == null ? '–' : (100 * sh(id)).toFixed(0) + '%'}${bw ? ' · ' + (100 * bw(id)).toFixed(0) + '%' : ''}</span>`).join('');
    note = bw ? 'Share of the risk premium from your ratings · from your best–worst choices.' : 'Share of the risk premium from your ratings.';
  }
  return `<div class="def"><b>How your answers split the premium</b><span class="small">${note}</span><div class="wts">${rows}</div></div>`;
}
function payload(){
  const tick = Object.fromEntries(Object.entries(S.t).map(([k, v]) => [k, Math.round(v / 1000)]));
  const rate = o => o.ns ? 'ns' : o.best ?? null;
  return {format:'R10', rid, notice:T.notice_version, consent_at:S.consentAt, role:T.roles[S.role] ?? null, exp:D.EXP[S.exp] ?? null,
    known:S.known, best_known:S.best ?? S.known[0] ?? null, technology:S.tech, variant:S.v, how_known:T.how[S.how] ?? null,
    risk_order:S.order, page_order:S.numFirst ? 'rate_first' : 'ratings_first',
    baseline_0_10:S.base, baseline_rate_pct:rate(S.rate), rate_basis:T.basis[S.basis] ?? null, financed_by:T.finby[S.finby.rate] ?? null,
    country:T.countries[S.country] ?? null, wind_rate_pct:rate(S.wind),
    change_m2_p2:S.chg, variant_rate_pct:rate(S.vrate), variant_financed_by:T.finby[S.finby.vrate] ?? null, seconds_per_screen:tick, comment:S.comment,
    ...(REVIEW ? {survey_format:S.fmt} : {}),
    ...(S.fmt === 'bws' ? {best_worst:S.sets.map((set, i) => ({set, largest:S.bws[i]?.b ?? null, smallest:S.bws[i]?.w ?? null}))} : {}),
    ...(S.fmt === 'ahp' ? {ahp_baseline:S.ahp.base, ahp_variant:S.v ? S.ahp.var : null} : {})};
}

function track(){ const now = Date.now(); S.t[S.step] = (S.t[S.step] || 0) + now - S.tIn; S.tIn = now; }
function render(){
  const st = steps(), i = st.indexOf(S.step);
  document.getElementById('ttl').textContent = T.title;
  document.getElementById('prog').style.width = (S.done ? 100 : Math.round(100 * i / (st.length - 1))) + '%';
  document.getElementById('app').innerHTML = S.done ? VIEW.done() : VIEW[S.step]();
  document.getElementById('err').textContent = '';
  document.getElementById('foot').hidden = S.done;
  document.getElementById('back').disabled = i === 0;
  const next = document.getElementById('next');
  next.textContent = S.step === 'intro' ? 'Start survey' : S.step === 'review' ? 'Submit' : 'Next';
  next.disabled = S.step === 'intro' && !S.consent;
  bind();
}
function keep(fn){ const sc = document.getElementById('scroll'), y = sc.scrollTop; fn(); render(); sc.scrollTop = y; }

// Slider answers, as on the live page: input/change/click, or a tap that ends where it started (a finger that
// moves more than 10 px is a scroll and records nothing).
function onAnswer(el, fn){
  let t0 = null;
  ['input', 'change', 'click'].forEach(ev => el.addEventListener(ev, () => fn(el)));
  el.addEventListener('touchstart', e => { const p = e.changedTouches[0]; t0 = [p.clientX, p.clientY]; }, {passive:true});
  el.addEventListener('touchend', e => { const p = e.changedTouches[0]; if (t0 && Math.abs(p.clientX - t0[0]) < 10 && Math.abs(p.clientY - t0[1]) < 10) fn(el); t0 = null; }, {passive:true});
}

function bind(){
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  if (S.done){
    $('#restart').onclick = () => location.reload();
    const an = $('#another');
    if (an) an.onclick = () => { Object.assign(S, {done:false, step:'method', fmt:null, base:{}, chg:{}, rate:{}, vrate:{}, wind:{}, basis:null, how:null,
      finby:{rate:null, vrate:null}, country:null, bws:{}, ahp:{base:{}, var:{}}, comment:'', warned:false}); render(); };
    return;
  }
  const pn = $('#pn'); if (pn) pn.onclick = e => { e.preventDefault(); openNotice(); };
  if (S.step === 'intro') $('#consent').onchange = e => { S.consent = e.target.checked; S.consentAt = S.consent ? new Date().toISOString() : null; $('#next').disabled = !S.consent; };
  $$('input[name=fmt]').forEach(el => el.onchange = () => keep(() => { S.fmt = el.value; }));
  $$('[data-bset]').forEach(b => b.onclick = () => keep(() => { const i = +b.dataset.bset, k = b.dataset.bk, o = k === 'b' ? 'w' : 'b', cur = S.bws[i] || {};
    cur[k] = cur[k] === b.dataset.bid ? undefined : b.dataset.bid; if (cur[o] === cur[k]) cur[o] = undefined; S.bws[i] = cur; }));
  $$('[data-pk]').forEach(b => b.onclick = () => keep(() => { const part = S.step === 'sa_ahp' ? 'base' : 'var'; S.ahp[part][b.dataset.pk] = +b.dataset.pv; }));
  $$('input[name=role]').forEach(el => el.onchange = () => S.role = +el.value);
  $$('input[name=exp]').forEach(el => el.onchange = () => S.exp = +el.value);
  $$('input[name=known]').forEach(el => el.onchange = () => keep(() => { S.known = $$('input[name=known]:checked').map(x => x.value); if (!S.known.includes(S.best)) S.best = null; }));
  $$('input[name=best]').forEach(el => el.onchange = () => S.best = el.value);
  $$('.info').forEach(b => b.onclick = () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    $$('.info').forEach(o => { o.setAttribute('aria-expanded', 'false'); document.getElementById('d-' + o.dataset.i).hidden = true; });
    if (!open){ b.setAttribute('aria-expanded', 'true'); document.getElementById('d-' + b.dataset.i).hidden = false; }
  });
  const clearWarn = () => { const w = document.getElementById('werr'); if (w){ w.hidden = true; w.textContent = ''; } };
  $$('input[data-b]').forEach(el => onAnswer(el, el => {
    const id = el.dataset.b, x = +el.value; S.base[id] = x;
    const l = document.getElementById('bv-' + id); l.textContent = x + ' / 10'; l.className = 'bv ' + band(x);
    el.classList.remove('unset'); el.setAttribute('aria-valuetext', x + ' of 10'); el.closest('.srow').classList.remove('need');
    const n = document.querySelector(`.nsb[data-n="${id}"]`); if (n) n.setAttribute('aria-pressed', 'false'); clearWarn();
  }));
  $$('.nsb[data-n]').forEach(b => b.onclick = () => keep(() => { const id = b.dataset.n; if (S.base[id] === 'ns') delete S.base[id]; else S.base[id] = 'ns'; }));
  $$('.sb[data-c]').forEach(b => b.onclick = () => keep(() => { S.chg[b.dataset.c] = +b.dataset.x; }));
  $$('.nsb[data-cn]').forEach(b => b.onclick = () => keep(() => { const id = b.dataset.cn; if (S.chg[id] === 'ns') delete S.chg[id]; else S.chg[id] = 'ns'; }));
  ['rate', 'vrate', 'wind'].forEach(st => {
    const i = document.getElementById('r-' + st), n = document.getElementById('ns-' + st);
    if (i) i.oninput = () => S[st].best = i.value === '' ? null : +i.value;
    if (n) n.onclick = () => keep(() => S[st] = S[st].ns ? {} : {ns:true});
  });
  const pick = (cur, i) => cur === i ? null : i;
  $$('[data-basis]').forEach(b => b.onclick = () => keep(() => S.basis = pick(S.basis, +b.dataset.i)));
  $$('[data-country]').forEach(b => b.onclick = () => keep(() => S.country = pick(S.country, +b.dataset.i)));
  $$('[data-finby]').forEach(b => b.onclick = () => keep(() => S.finby[b.dataset.finby] = pick(S.finby[b.dataset.finby], +b.dataset.i)));
  $$('[data-how]').forEach(b => b.onclick = () => keep(() => S.how = S.how === +b.dataset.how ? null : +b.dataset.how));
  if (S.step === 'review') $('#comment').oninput = e => S.comment = e.target.value;
}

function openNotice(){
  document.getElementById('nbody').innerHTML = `<p><b>What we collect.</b> If you take part, we record:</p><ul>${T.notice_collect.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p>${esc(T.notice_rest)}</p><p class="muted small">Notice version ${esc(T.notice_version)}.</p>`;
  document.getElementById('notice').hidden = false; document.getElementById('nclose').focus();
}
document.getElementById('nclose').onclick = () => { document.getElementById('notice').hidden = true; const pn = document.getElementById('pn'); if (pn) pn.focus(); };

function check(){
  const say = m => { document.getElementById('err').textContent = m; return false; };
  if (S.step === 'method' && !S.fmt) return say('Choose a format to review.');
  if (S.step === 'role' && S.role == null) return say('Choose your main role.');
  if (S.step === 'known' && !S.known.length) return say('Tick at least one technology.');
  if (S.step === 'best' && !S.best) return say('Choose the one you know best.');
  // assign the technology after the last "About you" page
  if ((S.step === 'known' && S.known.length === 1) || S.step === 'best'){
    const a = allocate();
    const answered = Object.keys(S.base).length || Object.keys(S.chg).length;
    if (S.tech && (S.tech !== a.t || S.v !== a.v) && answered && !S.warned){ S.warned = true; return say('Changing your technologies changes what you rate and clears your answers. Tap Next again to continue.'); }
    if (S.tech !== a.t || S.v !== a.v) Object.assign(S, {tech:a.t, v:a.v, base:{}, chg:{}, rate:{}, vrate:{}, wind:{}, basis:null, how:null});
  }
  const rateOk = (st, label) => {
    const o = S[st]; if (o.ns) return true;
    if (o.best == null) return say(`Enter ${label}, or tap "${T.rate_ns}".`);
    if (!(o.best > 0 && o.best <= 60)) return say(`${label[0].toUpperCase() + label.slice(1)} must be between 0.5 and 60%.`);
    return true;
  };
  const soft = (unsetIds) => {
    if (unsetIds.length && !S.warned){
      S.warned = true; render();
      const first = document.querySelector(`.srow[data-row="${unsetIds[0]}"]`), w = document.getElementById('werr');
      w.textContent = `${unsetIds.length} not set (highlighted below). Answer them, or tap Next again to continue without ${unsetIds.length === 1 ? 'it' : 'them'}.`;
      w.hidden = false; first.parentNode.insertBefore(w, first); w.scrollIntoView({block:'start'});
      return false;
    }
    S.warned = false; return true;
  };
  if (S.step === 'sa_rate') return soft(S.order.filter(id => S.base[id] === undefined));
  if (S.step === 'sa_num') return rateOk('rate', 'a discount rate for this project') && rateOk('wind', 'a rate for the wind farm');
  if (S.step === 'cmp_rate') return soft(cmpIds().filter(id => S.chg[id] === undefined));
  if (S.step === 'cmp_num') return rateOk('vrate', 'a discount rate for this version');
  if (S.step === 'sa_bws') return soft(S.sets.map((_, i) => i).filter(i => !(S.bws[i]?.b && S.bws[i]?.w)).map(i => 'set' + i));
  if (S.step === 'sa_ahp') return soft(S.pairs.map(([a, b]) => a + '|' + b).filter(k => S.ahp.base[k] == null));
  if (S.step === 'cmp_ahp') return soft(S.pairs.map(([a, b]) => a + '|' + b).filter(k => S.ahp.var[k] == null));
  return true;
}

document.getElementById('next').onclick = () => {
  if (!check()) return;
  track();
  if (S.step === 'review'){ S.records.push(payload()); S.done = true; render(); return; }
  const st = steps(); S.step = st[Math.min(st.indexOf(S.step) + 1, st.length - 1)]; S.warned = false; render(); document.getElementById('scroll').scrollTop = 0;
};
document.getElementById('back').onclick = () => { track(); const st = steps(); S.step = st[Math.max(0, st.indexOf(S.step) - 1)]; S.warned = false; render(); document.getElementById('scroll').scrollTop = 0; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('notice').hidden) document.getElementById('nclose').click(); });
render();
</script>
</body>
</html>
